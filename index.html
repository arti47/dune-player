<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17130e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4ead8" media="(prefers-color-scheme: light)">
  <meta name="description" content="Imperium Player — a player companion app for Dune: Adventures in the Imperium (2d20). Personal play aid.">
  <title>Imperium Player</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title"><svg class="app-mark" viewBox="0 0 128 128" width="28" height="28" aria-hidden="true"><defs><linearGradient id="appsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120e09"/><stop offset=".62" stop-color="#3a2414"/><stop offset="1" stop-color="#7a3a16"/></linearGradient></defs><rect width="128" height="128" rx="24" fill="url(#appsky)"/><circle cx="44" cy="40" r="17" fill="#ecdfc8" opacity=".92"/><circle cx="51" cy="35" r="15" fill="#1a130c" opacity=".55"/><circle cx="90" cy="32" r="7" fill="#e07b39"/><path d="M64 46 80 55.5v19L64 84 48 74.5v-19z" fill="none" stroke="#e8d3a4" stroke-width="5" stroke-linejoin="round"/><path d="M0 86 Q 34 66 64 82 T 128 78 V 128 H 0 Z" fill="#8a6a3f"/><path d="M0 100 Q 44 84 78 98 T 128 96 V 128 H 0 Z" fill="#c9a566"/><path d="M0 114 Q 52 104 90 112 T 128 110 V 128 H 0 Z" fill="#e8d3a4"/></svg><span id="app-screen">Imperium Player</span></h1>
    <span class="app-actions"><button id="search-btn" class="icon-btn" aria-label="Search screens, actions and rules" title="Search"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button><span id="app-help"></span><button id="theme-btn" class="icon-btn" aria-label="Toggle light or dark theme" title="Theme"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg></button></span>
  </header>

  <main id="screen" class="screen" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="Main">
    <!-- populated by router.js -->
  </nav>

  <div id="toast-region" aria-live="polite" class="toast-region"></div>
  <noscript><p class="noscript">Imperium Player needs JavaScript to run.</p></noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
