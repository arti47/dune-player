<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17130e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4ead8" media="(prefers-color-scheme: light)">
  <meta name="description" content="Imperium Player — a player companion app for Dune: Adventures in the Imperium (2d20). Personal play aid.">
  <title>Imperium Player</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title"><svg class="app-mark" viewBox="0 0 128 128" width="28" height="28" aria-hidden="true"><rect width="128" height="128" rx="24" fill="#17130e"/><circle cx="88" cy="38" r="16" fill="#c8571b"/><path d="M0 78 Q 36 54 64 74 T 128 70 V 128 H 0 Z" fill="#8a6a3f"/><path d="M0 94 Q 44 76 78 92 T 128 90 V 128 H 0 Z" fill="#c9a566"/><path d="M0 110 Q 52 98 90 108 T 128 106 V 128 H 0 Z" fill="#e8d3a4"/></svg><span>Imperium Player</span></h1>
    <button id="theme-btn" class="icon-btn" aria-label="Toggle light or dark theme" title="Theme"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg></button>
  </header>

  <main id="screen" class="screen" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="Main">
    <!-- populated by router.js -->
  </nav>

  <div id="toast-region" aria-live="polite" class="toast-region"></div>
  <noscript><p class="noscript">Imperium Player needs JavaScript to run.</p></noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
